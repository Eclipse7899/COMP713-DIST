services:
  auth:
    image: auth-service:latest
    build:
      dockerfile: ./auth-service.Dockerfile
    ports:
      - "5051:5051"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydb
      JWT_SECRET: secret_that_is_at_least_32_characters_long
    networks:
      - webnet
    depends_on:
      db-init:
        condition: service_completed_successfully
  frontend:
    build:
      dockerfile: ./frontend.Dockerfile
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - webnet
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      dockerfile: ./backend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydb
      JWT_SECRET: secret_that_is_at_least_32_characters_long
      AUTH_HOST: auth
      AUTH_PORT: 5051
    networks:
      - webnet
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - auth

  db-init:
    image: db-init:latest
    build:
      dockerfile: ./db-init.Dockerfile
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydb
    networks:
      - webnet
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 3

networks:
  webnet:

volumes:
  postgres_data:

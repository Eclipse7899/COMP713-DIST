services:
    frontend:
        build:
            context: .
            dockerfile: ./frontend/Dockerfile
        ports:
            - "8080:80"
        networks:
            - webnet

    backend:
        build:
            context: ./backend
        ports:
        - "3000:3000"
        environment:
            - DATABASE_URL=postgres://user:password@db:5432/mydb
        networks:
        - webnet
        depends_on:
        - db

    db:
        image: postgres:latest
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: mydb
        ports:
        - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        networks:
        - webnet

networks:
    webnet:

volumes:
    postgres_data:
services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - webnet
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydb
      JWT_SECRET: secret_that_is_at_least_32_characters_long
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-init:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydb
    entrypoint: ["bun", "run"]
    command: >
      sh -c "
        bunx prisma migrate deploy &&
        bunx prisma db seed
      "
    networks:
      - webnet
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 3

networks:
  webnet:

volumes:
  postgres_data:

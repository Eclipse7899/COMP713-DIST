services:
    web:
        image: nginx:latest
        ports:
        - "80:80"
        volumes:
        - ./frontend/dist:/usr/share/nginx/html
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
        - webnet
        depends_on:
        - backend

    backend:
        build:
            context: ./backend
        ports:
        - "3000:3000"
        environment:
            - DATABASE_URL=postgres://user:password@db:5432/mydb
        networks:
        - webnet
        depends_on:
        - db

    db:
        image: postgres:latest
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: mydb
        ports:
        - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql

networks:
    webnet:

volumes:
    postgres_data:
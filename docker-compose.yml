services:
  auth:
    image: auth-service:latest
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    ports:
      - '5051:5051'
    environment:
      DATABASE_URL: postgresql://user:password@auth-db:5432/mydb
      JWT_SECRET: secret_that_is_at_least_32_characters_long
    networks:
      - webnet
    depends_on:
      auth-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 5051 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - '80:80'
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - webnet
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://user:password@backend-db:5432/mydb
      JWT_SECRET: secret_that_is_at_least_32_characters_long
      AUTH_HOST: auth
      AUTH_PORT: 5051
    networks:
      - webnet
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          '--show-error',
          '--max-time',
          '5',
          'http://127.0.0.1:3000/api/health',
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      auth:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully

  auth-init:
    image: auth-db-init:latest
    build:
      context: .
      dockerfile: ./auth-service/init.Dockerfile
    environment:
      DATABASE_URL: postgresql://user:password@auth-db:5432/mydb
    networks:
      - webnet
    depends_on:
      auth-db:
        condition: service_healthy

  backend-init:
    image: backend-db-init:latest
    build:
      context: .
      dockerfile: ./backend/init.Dockerfile
    environment:
      DATABASE_URL: postgresql://user:password@backend-db:5432/mydb
    networks:
      - webnet
    depends_on:
      backend-db:
        condition: service_healthy

  backend-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - '5432:5432'
    volumes:
      - postgres_backend_data:/var/lib/postgresql
    networks:
      - webnet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d mydb']
      interval: 5s
      timeout: 5s
      retries: 3

  auth-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - '5433:5432'
    volumes:
      - postgres_auth_data:/var/lib/postgresql
    networks:
      - webnet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d mydb']
      interval: 5s
      timeout: 5s
      retries: 3

networks:
  webnet:

volumes:
  postgres_backend_data:
  postgres_auth_data:
